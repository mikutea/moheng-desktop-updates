name: Deploy status page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate locked update surface
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce bootstrap lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          docs = Path("docs")
          expected = {
              "channels/README.md",
              "index.html",
              "status.json",
          }
          actual = {
              path.relative_to(docs).as_posix()
              for path in docs.rglob("*")
              if path.is_file()
          }
          if actual != expected:
              raise SystemExit(
                  f"bootstrap_locked docs allowlist mismatch: {sorted(actual)}"
              )

          status = json.loads((docs / "status.json").read_text(encoding="utf-8"))
          expected_fields = {
              "schemaVersion",
              "channel",
              "state",
              "clientFeed",
              "feedPublished",
              "installerPublished",
              "message",
          }
          if set(status) != expected_fields:
              raise SystemExit("bootstrap status fields are invalid")
          if status["schemaVersion"] != "moheng.public-update-status.v1":
              raise SystemExit("bootstrap status schema is invalid")
          if status["channel"] != "stable" or status["state"] != "bootstrap_locked":
              raise SystemExit("bootstrap lock state changed without activation workflow")
          for field in ("clientFeed", "feedPublished", "installerPublished"):
              if status[field] is not False:
                  raise SystemExit(f"{field} must remain false while bootstrap is locked")

          forbidden = re.compile(
              r"BEGIN (?:OPENSSH |RSA |EC )?PRIVATE KEY|"
              r"github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|"
              r"AKIA[0-9A-Z]{16}"
          )
          for relative in sorted(actual):
              path = docs / relative
              if path.stat().st_size > 128 * 1024:
                  raise SystemExit(f"unexpectedly large public status file: {relative}")
              if forbidden.search(path.read_text(encoding="utf-8")):
                  raise SystemExit(f"potential secret in public status file: {relative}")
          PY

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload status page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
